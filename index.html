<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
    }

    .scoreboard {
      display: flex;
      gap: 40px;
      margin-bottom: 25px;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px 30px;
      border-radius: 12px;
      font-size: 1.2rem;
    }

    .scoreboard div {
      text-align: center;
    }

    .scoreboard .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      opacity: 0.8;
      letter-spacing: 1px;
    }

    .scoreboard .value {
      font-size: 1.8rem;
      font-weight: bold;
    }

    #status {
      font-size: 1.4rem;
      margin-bottom: 20px;
      min-height: 1.5em;
      font-weight: 600;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 120px);
      grid-template-rows: repeat(3, 120px);
      gap: 10px;
      background: rgba(0, 0, 0, 0.35);
      padding: 12px;
      border-radius: 14px;
    }

    .cell {
      background: #fff;
      color: #1e3c72;
      font-size: 3.5rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .cell:hover:not(.disabled) {
      background: #eaf2ff;
      transform: scale(1.03);
    }

    .cell.taken {
      cursor: default;
    }

    .cell.x {
      color: #2a5298;
    }

    .cell.o {
      color: #d32f2f;
    }

    .cell.winner {
      background: #ffd700;
      color: #1e3c72;
    }

    .controls {
      margin-top: 25px;
      display: flex;
      gap: 15px;
    }

    button {
      font-size: 1rem;
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      background: #ffd700;
      color: #1e3c72;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #ffeb3b;
      transform: scale(1.05);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 2px solid #fff;
    }

    button.secondary:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .mode-toggle {
      margin-top: 20px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 2px solid #fff;
    }

    @media (max-width: 480px) {
      .board {
        grid-template-columns: repeat(3, 90px);
        grid-template-rows: repeat(3, 90px);
      }
      .cell {
        font-size: 2.6rem;
      }
    }
  </style>
</head>
<body>
  <h1>TIC-TAC-TOE</h1>

  <div class="scoreboard">
    <div>
      <div class="label">Player X</div>
      <div class="value" id="scoreX">0</div>
    </div>
    <div>
      <div class="label">Draws</div>
      <div class="value" id="scoreDraws">0</div>
    </div>
    <div>
      <div class="label">Player O</div>
      <div class="value" id="scoreO">0</div>
    </div>
  </div>

  <div id="status">Player X's turn</div>

  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <div class="controls">
    <button id="resetRound">Reset Round</button>
    <button id="resetAll" class="secondary">Reset Scores</button>
  </div>

  <button class="mode-toggle" id="modeToggle">Play vs Computer</button>

  <script>
    const board = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const scoreXEl = document.getElementById('scoreX');
    const scoreOEl = document.getElementById('scoreO');
    const scoreDrawsEl = document.getElementById('scoreDraws');

    let currentPlayer = 'X';
    let boardState = ['', '', '', '', '', '', '', '', ''];
    let gameActive = true;
    let scores = { X: 0, O: 0, draws: 0 };
    const humanPlaysX = true; // Human is X when playing vs computer

    const WIN_LINES = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // cols
      [0, 4, 8], [2, 4, 6]              // diagonals
    ];

    const cells = document.querySelectorAll('.cell');

    function initGame() {
      boardState = ['', '', '', '', '', '', '', '', ''];
      gameActive = true;
      currentPlayer = 'X';
      renderBoard();
      statusEl.textContent = "Player X's turn";
    }

    function renderBoard() {
      cells.forEach(cell => {
        cell.textContent = boardState[Number(cell.dataset.index)] || '';
        cell.classList.toggle('taken', boardState[Number(cell.dataset.index)] !== '');
        cell.classList.toggle('x', boardState[Number(cell.dataset.index)] === 'X');
        cell.classList.toggle('o', boardState[Number(cell.dataset.index)] === 'O');
        cell.classList.toggle('winner', false);
      });

      const winLine = getWinLine();
      if (winLine) {
        winLine.forEach(i => {
          cells[i].classList.add('winner');
        });
      }
    }

    function getWinLine() {
      for (const line of WIN_LINES) {
        const [a, b, c] = line;
        if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
          return line;
        }
      }
      return null;
    }

    function checkGameEnd() {
      const winLine = getWinLine();
      const roundOver = winLine !== null || boardState.every(s => s !== '');

      if (winLine) {
        const winner = boardState[winLine[0]];
        scores[winner] += 1;
        updateScoreboard();
        statusEl.textContent = winner === 'X' ? 'Player X wins! 🎉' : 'Player O wins! 🎉';
        gameActive = false;
        return;
      }

      if (boardState.every(s => s !== '')) {
        scores.draws += 1;
        updateScoreboard();
        statusEl.textContent = "It's a draw!";
        gameActive = false;
        return;
      }

      return winLine;
    }

    function updateScoreboard() {
      scoreXEl.textContent = scores.X;
      scoreOEl.textContent = scores.O;
      scoreDrawsEl.textContent = scores.draws;
    }

    function handleClick(e) {
      const idx = Number(e.target.dataset.index);
      if (boardState[idx] || !gameActive) return;

      boardState[idx] = currentPlayer;
      renderBoard();

      if (checkGameEnd()) {
        gameActive = false;
        return;
      }

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      statusEl.textContent = `Player ${currentPlayer}'s turn`;
      if (gameActive && isVsComputer()) {
        setTimeout(computeComputerMove, 300);
      }
    }

    function isVsComputer() {
      return document.getElementById('modeToggle').textContent.includes('Computer');
    }

    function computeComputerMove() {
      const empty = boardState.map((s, i) => s === '' ? i : -1).filter(i => i !== -1);
      if (empty.length === 0) return;

      let bestMove = empty[0];
      let bestScore = -Infinity;

      for (const move of empty) {
        boardState[move] = 'O';
        const score = minimax(boardState, 0, false);
        boardState[move] = '';
        if (score > bestScore) {
          bestScore = score;
          bestMove = move;
        }
      }

      boardState[bestMove] = 'O';
      renderBoard();

      if (checkGameEnd()) {
        gameActive = false;
        return;
      }

      currentPlayer = 'X';
      statusEl.textContent = "Player X's turn";
    }

    function minimax(state, depth, isMaximizing) {
      const winLine = getWinLine();
      if (winLine) {
        const winner = state[winLine[0]];
        return winner === 'O' ? 10 - depth : winner === 'X' ? depth - 10 : 0;
      }
      if (state.every(s => s !== '')) return 0;

      const current = isMaximizing ? 'O' : 'X';
      const empty = state.map((s, i) => s === '' ? i : -1).filter(i => i !== -1);
      if (empty.length === 0) return 0;

      if (isMaximizing) {
        let best = -Infinity;
        for (const move of empty) {
          state[move] = 'O';
          best = Math.max(best, minimax(state, depth + 1, false));
          state[move] = '';
        }
        return best;
      } else {
        let best = Infinity;
        for (const move of empty) {
          state[move] = 'X';
          best = Math.min(best, minimax(state, depth + 1, true));
          state[move] = '';
        }
        return best;
      }
    }

    cells.forEach(cell => {
      cell.addEventListener('click', handleClick);
    });

    document.getElementById('resetRound').addEventListener('click', () => {
      initGame();
    });

    document.getElementById('resetAll').addEventListener('click', () => {
      scores = { X: 0, O: 0, draws: 0 };
      updateScoreboard();
      initGame();
    });

    document.getElementById('modeToggle').addEventListener('click', () => {
      const vsComputer = isVsComputer();
      const newMode = !vsComputer;

      // Flip starting player when switching to computer mode so human always plays X
      if (newMode) {
        currentPlayer = 'X';
      } else {
        currentPlayer = 'X';
      }

      document.getElementById('modeToggle').textContent = newMode ? 'Play vs Computer' : 'Play vs Friend';
      initGame();
      statusEl.textContent = newMode ? "You (X) go first!" : "Player X's turn";
    });

    initGame();
  </script>
</body>
</html>
